<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Kozminski Business Review</title>
  <link rel="icon" type="image/png" href="assets/img/kbr-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;display=swap">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</helmet>
<a class="skip-link" href="#main" data-action="skip">Przejdź do treści</a>
<header id="site-header" class="site-header"></header>
<main id="main" tabindex="-1"></main>
<div id="site-footer"></div>
<div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static SCRIPTS = ['config.js','data/taxonomy.js','data/materials.js','services/storage.js','services/content.js','services/account.js','ui/icons.js','ui/core.js','ui/forms.js','ui/components.js','pages/home.js','pages/article.js','pages/lists.js','pages/auth.js','pages/account.js','pages/purchase.js','pages/misc.js','demo/demo-panel.js','app.js'];
  async componentDidMount() {
    if (window.__kbrBooted) { window.KBR && KBR.app && KBR.app.render(); return; }
    window.__kbrBooted = true;
    for (const f of Component.SCRIPTS) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'assets/js/' + f; s.async = false;
        s.onload = res; s.onerror = () => rej(new Error('Nie wczytano ' + f));
        document.head.appendChild(s);
      });
    }
    KBR.app.init();
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
